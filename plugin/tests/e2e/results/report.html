    <!-- Prism.js for Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <script>
        // Data loaded from embedded JSON
        let summaryData = JSON.parse(document.getElementById("summary-data")?.textContent || "null");
        let resultsData = JSON.parse(document.getElementById("results-data")?.textContent || "[]");

        // Fetch data from external files (fallback)
        async function loadAndRender() {
            try {
                const summaryResponse = await fetch('latest.json');
                if (!summaryResponse.ok) throw new Error('latest.json not found');
                summaryData = await summaryResponse.json();

                const resultsResponse = await fetch('latest.jsonl');
                if (!resultsResponse.ok) throw new Error('latest.jsonl not found');
                const resultsText = await resultsResponse.text();
                resultsData = resultsText.trim().split('\n').filter(line => line).map(line => JSON.parse(line));

                renderReport();
            } catch (error) {
                console.error('Failed to load data:', error);
                document.getElementById('test-results').innerHTML = `
                    <div class="error-box">
                        <strong>Data Load Failed</strong><br><br>
                        <code>latest.json</code> or <code>latest.jsonl</code> not found.<br><br>
                        Run tests first:<br>
                        <code style="background:#263238;color:#4CAF50;padding:8px;display:block;margin-top:8px;border-radius:4px;">
                        python tests/e2e/run_prompt_tests.py --live
                        </code>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        const categoryNames = {
            python: 'Python',
            py: 'Python',
            athena: 'Athena',
            ath: 'Athena',
            spark: 'Spark',
            spk: 'Spark',
            agent: 'Agent',
            multi_agent: 'Multi-Agent',
            ma: 'Multi-Agent'
        };

        function renderReport() {
            document.getElementById('timestamp').textContent =
                `Generated: ${new Date(summaryData.timestamp).toLocaleString('ko-KR')}`;

            const summaryGrid = document.getElementById('summary-grid');
            const cards = [
                { value: summaryData.total_prompts, label: 'Total Tests', class: '' },
                { value: summaryData.passed, label: 'Passed', class: 'pass' },
                { value: summaryData.failed, label: 'Failed', class: 'fail' },
                { value: summaryData.pass_rate.toFixed(1) + '%', label: 'Pass Rate', class: 'score' },
                { value: (summaryData.average_latency_ms / 1000).toFixed(1) + 's', label: 'Avg Latency', class: 'time' }
            ];
            summaryGrid.innerHTML = cards.map(c => `
                <div class="card ${c.class}">
                    <div class="value">${c.value}</div>
                    <div class="label">${c.label}</div>
                </div>
            `).join('');

            const categoryBars = document.getElementById('category-bars');
            categoryBars.innerHTML = Object.entries(summaryData.by_category).map(([cat, data]) => {
                const passRate = data.total > 0 ? (data.passed / data.total * 100) : 0;
                return `
                    <div class="category-bar">
                        <div class="category-name">${categoryNames[cat] || cat}</div>
                        <div class="category-progress">
                            <div class="category-progress-fill" style="width: ${passRate}%"></div>
                        </div>
                        <div class="category-stats">
                            ${data.passed}/${data.total} (${passRate.toFixed(0)}%)
                        </div>
                    </div>
                `;
            }).join('');

            function renderLineage(execution) {
                const steps = execution.steps || [];
                if (steps.length === 0) {
                    return '<p style="color: #757575; font-style: italic;">No execution steps recorded</p>';
                }

                let lineageHtml = '<div class="lineage-container"><div class="lineage-line"></div>';

                steps.forEach(step => {
                    // Build code block if present
                    let codeBlock = '';
                    if (step.code && step.code.trim()) {
                        codeBlock = `
                            <div class="step-code-block">
                                <div class="code-label">📝 Code</div>
                                <pre><code class="language-python">${escapeHtml(step.code)}</code></pre>
                            </div>
                        `;
                    }

                    // Build output block if present
                    let outputBlock = '';
                    if (step.output && step.output.trim()) {
                        outputBlock = `
                            <div class="step-output-block">
                                <div class="output-label">📤 Output</div>
                                <pre>${escapeHtml(step.output)}</pre>
                            </div>
                        `;
                    }

                    lineageHtml += `
                        <div class="lineage-step ${step.phase}">
                            <div class="lineage-header">
                                <span class="lineage-phase ${step.phase}">${step.phase.toUpperCase()}</span>
                                <span class="lineage-time">${step.duration_ms}ms (@ ${step.start_time_ms}ms)</span>
                            </div>
                            <div class="lineage-description">${escapeHtml(step.description)}</div>
                            ${codeBlock}
                            ${outputBlock}
                        </div>
                    `;
                });

                lineageHtml += '</div>';

                const totalTime = execution.duration_ms || 0;
                lineageHtml += `
                    <div class="perf-summary">
                        <div class="perf-item">
                            <div class="perf-value total">${(totalTime / 1000).toFixed(1)}s</div>
                            <div class="perf-label">Total Time</div>
                        </div>
                    </div>
                `;

                return lineageHtml;
            }

            const testResults = document.getElementById('test-results');
            testResults.innerHTML = resultsData.map((test, index) => {
                const isPass = test.execution.success;
                const output = test.execution.output || test.execution.error || 'No output';
                const category = test.category || test.prompt_id.split('-')[0].toLowerCase();
                const formattedOutput = marked.parse(output);

                return `
                    <div class="test-item" id="test-${index}">
                        <div class="test-header" onclick="toggleTest(${index})">
                            <div class="test-status ${isPass ? 'pass' : 'fail'}">
                                ${isPass ? '\u2713' : '\u2717'}
                            </div>
                            <div class="test-info">
                                <div class="test-id">
                                    ${test.prompt_id}
                                    <span class="category-badge ${category}">${categoryNames[category] || category}</span>
                                </div>
                                <div class="test-prompt">${escapeHtml(test.prompt_text.substring(0, 80))}${test.prompt_text.length > 80 ? '...' : ''}</div>
                            </div>
                            <div class="test-metrics">
                                <div class="metric">
                                    <div class="metric-value">${test.metrics.overall_score.toFixed(0)}</div>
                                    <div class="metric-label">Score</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-value">${(test.execution.duration_ms / 1000).toFixed(1)}s</div>
                                    <div class="metric-label">Time</div>
                                </div>
                            </div>
                            <div class="expand-icon">\u25BC</div>
                        </div>
                        <div class="test-detail">
                            <div class="detail-section">
                                <h4>Prompt (Input)</h4>
                                <div class="prompt-box">${escapeHtml(test.prompt_text)}</div>
                            </div>

                            <div class="detail-section lineage-section">
                                <h4>Execution Lineage</h4>
                                ${renderLineage(test.execution)}
                            </div>

                            <div class="detail-section">
                                <h4>Response (Output)</h4>
                                ${isPass
                                    ? `<div class="response-box">${formattedOutput}</div>`
                                    : `<div class="error-box">Error: ${escapeHtml(test.execution.error || 'Unknown error')}</div>`
                                }
                            </div>

                            ${test.execution.code_generated ? `
                            <div class="detail-section">
                                <h4>Generated Code</h4>
                                <div class="code-box">
                                    <pre><code class="language-python">${escapeHtml(test.execution.code_generated)}</code></pre>
                                </div>
                            </div>
                            ` : ''}

                            <div class="detail-section">
                                <h4>Metrics</h4>
                                <div class="metrics-grid">
                                    <div class="metric-card">
                                        <div class="metric-value" style="color: ${test.metrics.response_quality >= 70 ? '#4CAF50' : '#FF9800'}">${test.metrics.response_quality.toFixed(0)}%</div>
                                        <div class="metric-label">Response Quality</div>
                                    </div>
                                    <div class="metric-card">
                                        <div class="metric-value" style="color: ${test.metrics.pattern_match >= 80 ? '#4CAF50' : '#FF9800'}">${test.metrics.pattern_match.toFixed(0)}%</div>
                                        <div class="metric-label">Pattern Match</div>
                                    </div>
                                    <div class="metric-card">
                                        <div class="metric-value" style="color: ${test.metrics.latency_score >= 60 ? '#4CAF50' : '#FF9800'}">${test.metrics.latency_score.toFixed(0)}%</div>
                                        <div class="metric-label">Latency Score</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            Prism.highlightAll();
        }

        function toggleTest(index) {
            const item = document.getElementById(`test-${index}`);
            item.classList.toggle('expanded');
            if (item.classList.contains('expanded')) {
                Prism.highlightAllUnder(item);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (summaryData && resultsData.length) { renderReport(); } else { loadAndRender(); }
        });
    </script>
</body>
</html>
